apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  namespace: chat-app
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  # This policy ensures your data stays intact on the host even if you delete the PVC
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    # Change this path to where you want the chat history/database to live on your machine
    path: /tmp
